<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Mithu the parakeet, first draft">
  <!-- long tail -->
  <path d="M92 160 L60 198 L84 190 L88 199 L108 162 Z" fill="#2B7FD9"/>
  <path d="M98 162 L84 190 L88 199 L108 162 Z" fill="#1E5FA8"/>
  <!-- feet -->
  <path d="M84 172 v10 M78 182 h12 M116 172 v10 M110 182 h12" stroke="#F08C2E" stroke-width="5" stroke-linecap="round" fill="none"/>
  <!-- body -->
  <ellipse cx="100" cy="128" rx="38" ry="48" fill="#1FA67A"/>
  <ellipse cx="102" cy="138" rx="23" ry="32" fill="#CDE86B"/>
  <!-- wing -->
  <ellipse cx="68" cy="130" rx="13" ry="31" fill="#15805D" transform="rotate(8 68 130)"/>
  <!-- head -->
  <circle cx="100" cy="68" r="36" fill="#1FA67A"/>
  <!-- neck ring: black line with a rose line under it -->
  <path d="M68 86 Q100 110 132 86" fill="none" stroke="#F27BA0" stroke-width="5" stroke-linecap="round" transform="translate(0 4)"/>
  <path d="M68 86 Q100 110 132 86" fill="none" stroke="#1f1b16" stroke-width="4" stroke-linecap="round"/>
  <!-- head tuft -->
  <path d="M96 33 Q92 20 102 16 Q100 26 108 22 Q104 30 106 34 Z" fill="#15805D"/>
  <!-- eyes with half lids (dry, witty look) -->
  <circle cx="84" cy="62" r="11" fill="#fff"/>
  <circle cx="116" cy="62" r="11" fill="#fff"/>
  <circle cx="86" cy="64" r="5" fill="#1f1b16"/>
  <circle cx="114" cy="64" r="5" fill="#1f1b16"/>
  <path d="M72 59 Q84 48 96 59 Z" fill="#15805D"/>
  <path d="M104 59 Q116 48 128 59 Z" fill="#15805D"/>
  <!-- hooked red beak -->
  <path d="M90 72 Q100 62 110 72 Q111 88 100 96 Q97 84 90 72 Z" fill="#E5484D"/>
  <path d="M96 84 Q100 88 105 84 Q104 92 100 96 Q98 90 96 84 Z" fill="#B4232A"/>
  <!-- commentator headphones -->
  <path d="M64 66 Q64 26 100 26 Q136 26 136 66" fill="none" stroke="#7C5CFF" stroke-width="6" stroke-linecap="round"/>
  <rect x="55" y="56" width="14" height="26" rx="7" fill="#7C5CFF"/>
  <rect x="131" y="56" width="14" height="26" rx="7" fill="#7C5CFF"/>
  <!-- small mic -->
  <path d="M62 80 Q62 98 82 98" fill="none" stroke="#5B43C9" stroke-width="3" stroke-linecap="round"/>
  <circle cx="84" cy="98" r="4" fill="#5B43C9"/>
</svg>
